apiVersion: v1
kind: Service
metadata:
  name: save-backend
  namespace: save
spec:
  selector:
    app: save-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: save-backend
  namespace: save
spec:
  replicas: 1
  selector:
    matchLabels:
      app: save-backend
  template:
    metadata:
      labels:
        app: save-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: REPLACE_WITH_REGISTRY/save-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: FRONTEND_ORIGINS
              value: "https://save.shamdani.fr"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: save-backend-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
