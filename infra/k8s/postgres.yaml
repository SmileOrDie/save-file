apiVersion: v1
kind: Service
metadata:
  name: save-postgres
  namespace: save
spec:
  selector:
    app: save-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: save-postgres
  namespace: save
spec:
  serviceName: save-postgres
  replicas: 1
  selector:
    matchLabels:
      app: save-postgres
  template:
    metadata:
      labels:
        app: save-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: save
            - name: POSTGRES_USER
              value: save_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: save-postgres-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U save_app -d save"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U save_app -d save"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
        # Set storageClassName only after reviewing the cluster's StorageClass.
